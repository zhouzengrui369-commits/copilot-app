      - 不写: apps/web/、apps/server/、其他 sub-agent worktree、4 docs、packages/kb/

      核心范围 (≤ 30min cap, 3 wave 拆):
      - wave 1 (≤10min): Vector store scaffold — sqlite-vss (本地优先) + Embedding wrapper (mxbai-embed-large via Ollama HTTP)
      - wave 2 (≤10min): Indexing pipeline — chunk KB 笔记 (按段落 512 token) → embed → store vss table
