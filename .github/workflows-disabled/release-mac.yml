name: release-mac

# Build macOS .dmg + .zip artifacts and (optionally) publish a GitHub Release.
# Triggered by:
#   - tags matching v*  (real release)
#   - workflow_dispatch  (manual test build)
#
# macOS runner is GitHub-hosted. 30-min job cap is respected.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release publish (build only)"
        required: false
        default: "true"

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  build-mac:
    name: build · macOS
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            **/node_modules
          key: ${{ runner.os }}-${{ matrix.arch }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-deps-

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build desktop (${{ matrix.arch }})
        working-directory: apps/copilot-desktop
        run: |
          if [ -f package.json ]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish=never
          else
            echo "::warning::apps/copilot-desktop not merged yet; skipping macOS build"
            mkdir -p dist
            echo "placeholder" > dist/.skip
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-desktop-mac-${{ matrix.arch }}
          path: |
            apps/copilot-desktop/dist/*.dmg
            apps/copilot-desktop/dist/*.zip
            apps/copilot-desktop/dist/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: publish release
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
