# Sprint 1.2 起点: Sprint 1.1 6 commit 已 merge main (c42cfba8 / 84d3d190 / 553fc688 / fd2f7c3d 等)
# 所有 depends_on: [] 表明 Sprint 1.2 不需 plan engine 调度 Sprint 1.1 task
# Sprint 1.1 那些 commit 在 main HEAD,worker worktree 自动继承,不需调度
# 只有 T-1.2.2 -> T-1.2.1 是 intra-sprint 真依赖
plan:
  name: 'Sprint 1.2 · Copilot App · Features (6 worker + 1 verifier)'
  max_concurrency: 6
  max_consecutive_failures: 2
  max_cycles: 12
  auto_reject_retries: 1
  # 钉子 #15 v2 (T-1.1.8 verifier c30333ea 落地 · 2026-07-09 14:38): 4 字段 schema
  # 来源: sprint1.1/SPRINT_1_1_COMMITS_INDEX.md
  # 作用域: plan.yaml task metadata + sub-agent dispatch 末尾必填
  # 跟 Sprint 1.1 5 PM salvage commits 不回填 git author (forward-only)
  metadata:
    author_role: PM
    dispatched_by: Mavis (PM session mvs_144239070a21476dae746d1cff6af16b)
    pm_spot_checked_by: None (待 verifier spot-check 5 follow-up commit)
    spot_check_at: None
    approved_by: NJX (plan.md v6.2 §2.2 NJX 7/9 11:51 已批, 不需重新拍板)
    baseline: Sprint 1.1 收口 (6 PM salvage commits @ main 9c7a3d67) + T-1.1.8 v6.2 派生 (c30333ea) + NJX 12:21 v6.2 baseline pop (ed86e59c)
    contract_freeze_in: packages/kg/SCHEMA-FROZEN-1.2.md
    next_sprint: Sprint 1.3 (W3 · 7/24-7/30) — T-1.3.1 RAG + T-1.3.2 Windows 打包
    # 钉子 #15 教训: 跨 sprint 退役归档 (sprint 2 plan_41740122 已退役, /tmp/openclaw_sprint2_retired_20260709/)
    retired_sprint_reference: /tmp/openclaw_sprint2_retired_20260709/  # 黑名单 worker session mvs_6e26ed6d89664045b2eb179058b9fafc
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.3
    # 钉子 #14 强化: cycle_close_audit 强制每 cycle 跑 (T-1.2.7)
    cycle_close_audit: T-1.2.7
    # 钉子 #15 v2 落地: PM cron 6h 自跑 cycle-close verifier (Mavis 14:38 拍板)
    pm_cycle_close_cron: 'mavis cron self sprint1.2-cycle-close --every 6h --prompt "..."'
tasks:
  # ========== T-1.2.1 — KG 构建器（最大 · 3 wave 拆） ==========
  - id: 'T-1.2.1'
    title: 'Knowledge Graph 构建器（LLM 实体/关系/标签/摘要 + 增量更新）'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    depends_on: []
    # 钉子 #15 v2 per-task 4 字段 (T-1.1.8 c30333ea 落地)
    author_role: worker
    dispatched_by: mvs_144239070a21476dae746d1cff6af16b (PM Mavis)
    pm_spot_checked_by: None
    spot_check_at: None
    prompt: |
      你是 Sprint 1.2 worker α（KG builder）。读 `/Users/njx/openclaw/copilot/sprint1.2/T-1.2.1-KG-builder.md` 完整合同（goal / scope / forbidden / commands / deliverable / verify / wave 拆分）。

      必读基础文档（10 分钟不可省）：
      - /Users/njx/openclaw/copilot/goal.md v6.2（整份）
      - /Users/njx/openclaw/copilot/plan.md v6.2 §2.2 T-1.2.1
      - /Users/njx/openclaw/copilot/rules.md v6.2（整份 — 钉子 #14 §2.6 Done 硬条件必看）
      - /Users/njx/openclaw/copilot/delivery.md v6.2
      - /Users/njx/openclaw/copilot/sprint1.1/T-1.1.4-Local-KB-SQLite-MD.md（KB schema 基础）
      - /Users/njx/openclaw/copilot/packages/kb/SCHEMA-FROZEN-1.1.md（已冻 contract）

      工作位置：
      - 自己 worktree: `git worktree add ../copilot.wt-T121/wt-T121 -b sp1.2-T-1.2.1 main` (从 main HEAD 9c7a3d67)
      - 写：packages/kg/ 整目录、apps/copilot-desktop/src/kg/ 集成、tests、SELF-VERIFY-T-1.2.1.md、screenshots/T-1.2.1/*.png
      - 不写：apps/web/、apps/server/、其他 sub-agent worktree、4 docs

      **关键约束（30min cap 必看）**：
      T-1.2.1 是 Sprint 1.2 最大的 task（4-6h 估时），**必须 3 wave 拆**：
      - **wave 1 (≤25min)**: entity 抽取 — 从 KB 笔记抽 entity + 类型 + 置信度（用 LLM m3 wrapper）
      - **wave 2 (≤25min)**: relation 抽取 + 标签 + 摘要 — entity 之间的边 + 标签 + LLM 摘要
      - **wave 3 (≤25min)**: 增量更新 + 性能 baseline — 笔记变化时 KG 增量 < 2s + 20 笔记 ≥ 30 节点 ≥ 50 边
      - 任何 wave 超 25min → 立即 commit 当前进度 + 写 deliverable.md PARTIAL + 列剩余 todo，**不强行 PASS**

      **决策红线（plan.md §1 决策 2）**：
      - KG **100% 本地**（app 内存 + 本地 SQLite 持久化）
      - **严禁**在 cloud server 跑 LLM 抽 entity（cloud server 只做 LLM proxy + 远程管理）
      - 增量更新基于 KB 的 `kg_pending` 表（Sprint 1.1 T-1.1.4 schema 已包含）

      7*24h AI 提示：worker 可用 LLM 多次 verify/重试/深推理 — token 暂不考虑。

      HANDOVER MODE STRICT (30min hard cap, 与 Sprint 1.1 一致): VERDICT 必填 + 立即 commit handoff + 多 cycle auto retry。

      ## Done 硬条件 (Mavis 7/9 14:30 补强 · 防止 silent contract failure) — 钉子 #14
      报 done 前 3 件齐，缺一 = 视为未完成：
      1. `git add && git commit` （含新增文件 + tests + screenshots + deliverable.md + board entry）
      2. `outputs/T-1.2.1/deliverable.md` 写入（VERDICT 行 + 已跑命令 + 截图清单 + known limitations）
      3. `board.md` append in_progress → done 行

      完成：commit + push + 写 SELF-VERIFY-T-1.2.1.md + 截图 ≥ 4 张（KG 节点图 / 边关系 / 增量更新 / 性能 baseline）→ exit。
    verify_prompt: |
      你是 Sprint 1.2 的独立 verifier α，验证 worker α (KG builder) 的产出。

      必跑：
      1. cd /Users/njx/openclaw/copilot.wt-T121/wt-T121 && git log --oneline -5 (看到 sp1.2-T-1.2.1 分支新 commit)
      2. cat outputs/T-1.2.1/deliverable.md (存在，含 VERDICT 行)
      3. cat SELF-VERIFY-T-1.2.1.md (存在，含 4 验收信号 + 截图路径)
      4. ls screenshots/T-1.2.1/*.png | wc -l (≥ 4)
      5. cd packages/kg && npm install (exit 0)
      6. npm run check (exit 0, typescript 无错)
      7. npm run test (exit 0, coverage ≥ 70%)
      8. 跑性能 baseline：seed 20 条 KB 笔记 → 跑 KG builder → 验证 ≥ 30 节点 ≥ 50 边
      9. 跑增量更新：新增 1 条笔记 → 验证 KG 增量 < 2s
      10. grep -r "TODO\|FIXME\|XXX" packages/kg/src/ (避免明显未完工)
      11. **钉子 #14 verify**: git status --porcelain 应为空 + outputs/T-1.2.1/deliverable.md 存在 + board.md 含 done 行

      PASS 标准：
      - 所有 4 个验收信号（20 笔记 ≥ 30 节点 / ≥ 50 边 / 增量 < 2s / 性能 baseline）截图肉眼可见工作
      - npm run check + test 全过
      - 3 wave 拆分清晰（每 wave 单独 commit）
      - 没有 forbidden 文件被改 (git status 干净)
      - 钉子 #14 3 件齐

      FAIL 反馈要具体：哪个验收信号缺哪张证据 + 哪个命令失败 + exit code + 钉子 #14 哪件缺。

