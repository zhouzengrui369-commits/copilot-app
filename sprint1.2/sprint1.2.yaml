  # ========== T-1.2.7 — Verifier cycle-close audit（钉子 #15 落地） ==========
  - id: 'T-1.2.7'
    title: 'Verifier cycle-close audit（每 cycle 跑 · spot-check 30% + 关键决策审计）'
    assigned_to: verifier
    verified_by: PM
    max_retries: 1
    depends_on: []
    # 钉子 #15 v2 per-task 4 字段
    author_role: verifier
    dispatched_by: mvs_144239070a21476dae746d1cff6af16b (PM Mavis)
    pm_spot_checked_by: None
    spot_check_at: None
    is_cycle_close_audit: true
    prompt: |
      你是 Sprint 1.2 的 cycle-close verifier。每 cycle 结束自动触发（plan.yaml `cycle_close_audit: T-1.2.7`）。

      工作内容（5-10min/cycle）：
      1. **spot-check 30%**：本 cycle 内完成的 worker 任务，随机抽 30% 跑 6 件套 verify
         - git log <branch> --oneline -3 (commit 真实)
         - cat outputs/<task_id>/deliverable.md (VERDICT 行存在)
         - file <screenshot> (PNG header 真实，非 fabricated)
         - jest --listTests (suite 数对得上 deliverable 声明)
         - npm run check --workspaces (typecheck clean)
         - ls outputs/<task_id>/ (deliverable 文件齐)
      2. **关键决策审计**：
         - 钉子 #14 3 件齐 verify (commit + deliverable + board)
         - 钉子 #15 author_role 标识 verify
         - 决策红线 verify (KG 本地 / 云备份默认关 / 不污染 v5 W27)
         - cross-doc 一致性 (Sprint 1.1 SCHEMA-FROZEN-1.1.md 没被破坏)
      3. **写 audit 报告**：
         - 路径：sprint1.2/audit/cycle-<N>-audit.md
         - 格式：抽查 task list + 每 task 6 件套结果 + 关键决策审计结果 + overall verdict (PASS/PARTIAL/FAIL) + 异常 list
         - VERDICT 行必填

      30min cap：单 wave（5-10min 估时），超 15min → PARTIAL。

      ## Done 硬条件 — 钉子 #14 (verifier 版)
      1. git add audit/cycle-<N>-audit.md && git commit
      2. outputs/T-1.2.7/cycle-<N>-deliverable.md (含 VERDICT)
      3. board.md append audit done 行
    verify_prompt: |
      PM 验证 verifier 的 audit 报告。
      必跑：git log audit/ + audit 文件存在 + 抽查 task 列表与 plan 实际完成 task 一致 + 6 件套 verify 真跑了 + VERDICT 行存在。
      PASS：audit 报告完整 + 抽查与实际一致 + 关键决策有审计 + 钉子 #14 3 件齐。
      FAIL：audit 走过场 / 抽查与实际不符 / 关键决策漏审。
