      ## ⚠️ RETRY v2 · 钉子 #14 加固（cycle 3 zombie 教训）
      cycle 3 中 5 worker zombie 29min 0 commit (mvs_bf4a... 等)。retry v2 改 4 件额外硬约束:

      **Pre-work setup (≤2 min)** — 不做 = 视为未开始:
      1. worktree 已建 (`copilot.wt-T121v2/wt-T121v2`)
      2. `outputs/T-1.2.1/deliverable.md` 占位 stub（仅 VERDICT=PENDING + task_id + start_time,不写 VERDICT=FAIL/PASS）
      3. board.md append "in_progress" entry (含 author_role=worker, task_id, start_time, retry=v2)

      **Commit cadence (≤30min 硬 cap 内)**:
      - ≤5 min: 第一 git commit = scaffold (含 .gitignore + package.json + src/index.ts 占位 + tests/ 空 directory)
      - ≤10 min: 第一真实代码 commit (wave 1 part 1) — **如无,FAIL-START exit**
      - ≤20 min: wave 1 完整 commit
      - ≤25 min: wave 1 交付 + deliverable.md 必含最终 VERDICT 行 (PASS/PARTIAL/FAIL-START)

      **FAIL-START 早退** — 这是新增的关键保护:
      - 如果 ≤10 min 无任何代码 commit,主动写 deliverable.md VERDICT=FAIL-START (注明 reason: dispatch path throttle / LLM silent fail / prompt 未送达 / 其他)
      - 加 board.md FAIL-START entry → exit
      - 不静默 thrash 让 30min 走完 → 这正是 cycle 3 教训

      **波次节奏**：
      - wave 1 (≤25min): entity 抽取 — 从 KB 笔记抽 entity + 类型 + 置信度
      - wave 2 (≤25min): relation 抽取 + 标签 + 摘要
      - wave 3 (≤25min): 增量更新 + 性能 baseline (20 笔记 ≥ 30 节点 ≥ 50 边)
      - 任何 wave 超 25min → 立即 commit 当前进度 + 写 deliverable.md PARTIAL + 列剩余 todo

      **决策红线（plan.md §1 决策 2）**：
      - KG **100% 本地**（app 内存 + 本地 SQLite 持久化）
      - **严禁**在 cloud server 跑 LLM 抽 entity
      - 增量更新基于 KB 的 `kg_pending` 表（Sprint 1.1 T-1.1.4 schema 已包含）

      7*24h AI 提示：worker 可用 LLM 多次 verify/重试/深推理 — token 暂不考虑。

      ## Done 硬条件 — 钉子 #14 v2 (Mavis 7/10 06:38 拍板 retry v2 增订)
      报 done 前 4 件齐，缺一 = 视为未完成：
      1. `git add && git commit` （含新增文件 + tests + screenshots + deliverable.md + board entry）— commit cadence 满足
      2. `outputs/T-1.2.1/deliverable.md` 写入（VERDICT 行 + 已跑命令 + 截图清单 + known limitations）— stub 必先写
      3. `board.md` append in_progress → done 行 + retry=v2 标记
      4. **新增**：≤10 min 无 commit 必 FAIL-START 主动 exit,不可沉默 zombie

      完成：commit + push + 写 SELF-VERIFY-T-1.2.1.md + 截图 ≥ 4 张（KG 节点图 / 边关系 / 增量更新 / 性能 baseline）→ exit。
    verify_prompt: |
      你是 Sprint 1.2 RETRY v2 的独立 verifier α，验证 worker α (KG builder) 的产出。

      必跑：
      1. cd /Users/njx/openclaw/copilot.wt-T121v2/wt-T121v2 && git log --oneline -5 (看到 sp1.2-T-1.2.1-v2 分支新 commit) — 含 5min scaffold commit
      2. cat outputs/T-1.2.1/deliverable.md (存在, 含 VERDICT 行, retry=v2 标记)
      3. cat SELF-VERIFY-T-1.2.1.md (存在，含 4 验收信号 + 截图路径)
      4. ls screenshots/T-1.2.1/*.png | wc -l (≥ 4)
      5. cd packages/kg && npm install (exit 0)
      6. npm run check (exit 0, typescript 无错)
      7. npm run test (exit 0, coverage ≥ 70%)
      8. 跑性能 baseline：seed 20 条 KB 笔记 → 跑 KG builder → 验证 ≥ 30 节点 ≥ 50 边
      9. 跑增量更新：新增 1 条笔记 → 验证 KG 增量 < 2s
      10. grep -r "TODO\|FIXME\|XXX" packages/kg/src/ (避免明显未完工)
      11. **钉子 #14 v2 verify**: 
          - git status --porcelain 应为空
          - outputs/T-1.2.1/deliverable.md 存在 + 含 retry=v2
          - board.md 含 done 行
          - commit cadence log: git log --format='%ai %s' | awk '$1 < start+5min...$1 > start+10min' 必须有 ≥1 commit
          - 没有 v1 worktree / branch 被改 (`git diff main..sp1.2-T-1.2.1` 与 v1 branch 不混)

      PASS 标准：
      - 所有 4 个验收信号（20 笔记 ≥ 30 节点 / ≥ 50 边 / 增量 < 2s / 性能 baseline）截图肉眼可见工作
      - npm run check + test 全过
      - 3 wave 拆分清晰（每 wave 单独 commit）
      - 没有 forbidden 文件被改 (git status 干净)
      - 钉子 #14 v2 4 件齐

      FAIL 反馈要具体：哪个验收信号缺哪张证据 + 哪个命令失败 + exit code + 钉子 #14 v2 哪件缺。

