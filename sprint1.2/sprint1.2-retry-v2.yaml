      ## ⚠️ RETRY v2 · 工作位置变化（避免与 v1 zombie branches 冲突）
      - 自己 worktree: `git worktree add ../copilot.wt-T121v2/wt-T121v2 -b sp1.2-T-1.2.1-v2 main`
