workflow:
  chatgpt:
    role: GitHub branch/PR source development only
    local_candidate_execution: FORBIDDEN
  minimax_code:
    role: deploy and execute exact approved commit locally
    silent_source_fix: FORBIDDEN
  codex:
    role: independent real-computer experience and Release Gate verification
    source_fix: FORBIDDEN
r28:
  status: NEVER_RUN_PERMANENTLY_REJECTED
  executable: false
  reusable: false
  blockers:
    - "Gate 3 malformed/incomplete SHA256 ledger"
    - "Gate 2 unresolved fail-closed network authority"
    - "Gate 9 did not assert exact 113 tests in 9 files"
r30:
  status: REMOTE_SOURCE_IMPLEMENTED_AWAITING_LOCAL_EXECUTION
  local_execution: NOT_RUN
  electron_candidate: NOT_RUN
  branch: agent/r30-github-bound-candidate-runner
  runner:
    path: scripts/candidate-r30/run-candidate.mjs
    candidate_id: "copilot-r30-<full-source-commit>"
    evidence_directory: "absolute, outside repo, must not exist"
  red_green:
    contract_red_exit: 1
    contract_green_exit: 0
    runner_red_exit: 1
    runner_green_exit: 0
    document_red_exit: 1
    document_green_exit: 0
  static_validation:
    node_syntax: PASS
    pure_node_tests: "23/23 PASS"
    dry_run: PLAN_ONLY_NOT_A_CANDIDATE
    electron_launched: false
  gates:
    gate_1:
      source_commit: exact_full_40_hex
      source_clean: "required; tracked, untracked, and ignored generated candidate inputs absent"
    gate_2:
      authority: offline-only
      sandbox: "/usr/bin/sandbox-exec with deny network*"
      npm_install: "npm ci --offline --no-audit --no-fund"
      automatic_registry_fallback: false
      cache_miss: BLOCKED_NPM_CACHE_MISSING_APPROVAL_REQUIRED
    gate_3:
      algorithm: sha256
      digest: exact_64_lower_hex
      ledger_scope: complete_control_inputs
    gate_8:
      focused_packaged_electron: "2/2 required"
    gate_9:
      discovery_tests: 113
      discovery_files: 9
      exact: true
    gate_10:
      full_packaged_electron: "113/113 required"
      skipped: 0
      unexpected: 0
      flaky: 0
    gate_11:
      required_receipts:
        - source_snapshot_sha256
        - artifact_sha256
        - runtime_id
        - test_data_manifest
        - commands_and_exit_codes
        - screenshots
        - process_terminal_state
candidate:
  established: false
  candidate_id: null
  source_snapshot_sha256: null
  artifact_sha256: null
  runtime_id: null
  test_data_manifest: null
  screenshots: null
  process_terminal_state: null
independent_acceptance:
  minimax_receipt: NOT_RECEIVED
  codex_focused_retest: NOT_RUN
  codex_release_gate: NOT_RUN
release_gates:
  developer_id_signing: BLOCKED
  apple_notarization: BLOCKED
  staple_and_validate: BLOCKED
  candidate_bound_performance: BLOCKED
  verify_fix_rounds: "0/3 current final candidate"
  embedded_local_asr_runtime: BLOCKED
  human_owner_gate: BLOCKED
deferred_scope:
