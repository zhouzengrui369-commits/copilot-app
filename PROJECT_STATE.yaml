  tencent_deployment_remote_backup: OWNER_DEFERRED_POST_MVP
  graph_3d: POST_MVP
next_single_action: "Review R30 PR, then MiniMax Code deploys its exact final GitHub commit and returns candidate-bound receipts. Codex starts only after those receipts exist."
