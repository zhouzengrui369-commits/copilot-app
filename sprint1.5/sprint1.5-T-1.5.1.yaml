      8. `hexdump -C apps/copilot-desktop/release/njx-copilot-v6-0.1.0-x64-setup.exe | grep -c "Win32.*signature"` (期望 ≥ 1)
      9. `osslsigncode verify apps/copilot-desktop/release/njx-copilot-v6-0.1.0-x64-setup.exe` (期望 exit 0)
      10. `grep -E "CSC_KEY_PASSWORD" apps/copilot-desktop/.env.example` (占位存在)
